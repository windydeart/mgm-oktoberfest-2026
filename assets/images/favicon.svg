<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Amber/Orange Gradient matching Bierly -->
    <linearGradient id="bierlyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="beerGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="foamWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Circular Amber Base Badge -->
  <circle cx="32" cy="32" r="30" fill="url(#bierlyBg)" stroke="#fcd34d" stroke-width="1.5" filter="url(#shadow)"/>
  
  <!-- Beer Mug Vector -->
  <g transform="translate(13, 12)">
    <!-- Mug Handle -->
    <path d="M 23 11 C 30 11 32 15 32 21 C 32 27 29 30 23 30" fill="none" stroke="#fef3c7" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 23 11 C 30 11 32 15 32 21 C 32 27 29 30 23 30" fill="none" stroke="#d97706" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Glass Body (Beer) -->
    <path d="M 4 10 L 23 10 L 21 34 C 21 36.5 19 38.5 16.5 38.5 L 10.5 38.5 C 8 38.5 6 36.5 6 34 Z" fill="url(#beerGold)"/>
    
    <!-- Glass Highlights / Texture Vertical Ribs -->
    <line x1="9" y1="12" x2="8.5" y2="34" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.75"/>
    <line x1="16" y1="12" x2="15.5" y2="34" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    
    <!-- Rising Bubbles -->
    <circle cx="9" cy="24" r="1.1" fill="#ffffff" opacity="0.85"/>
    <circle cx="15" cy="28" r="1.3" fill="#ffffff" opacity="0.85"/>
    <circle cx="12" cy="18" r="1" fill="#ffffff" opacity="0.9"/>
    <circle cx="18" cy="20" r="1.1" fill="#ffffff" opacity="0.75"/>

    <!-- Foamy Head (Overflowing Froth) -->
    <path d="M 3 10 C 3 7 7 6 9 8 C 11 5 16 5 18 7 C 21 5 25 7 24 10 Z" fill="url(#foamWhite)"/>
    <!-- Fluffy foam circles -->
    <circle cx="6.5" cy="7.5" r="4.5" fill="url(#foamWhite)"/>
    <circle cx="13.5" cy="5.5" r="5" fill="url(#foamWhite)"/>
    <circle cx="20.5" cy="7" r="4.5" fill="url(#foamWhite)"/>
    <circle cx="10" cy="8.5" r="4" fill="url(#foamWhite)"/>
    <circle cx="17" cy="8.5" r="4" fill="url(#foamWhite)"/>
    <!-- Overflowing drip on left -->
    <path d="M 3 9 C 2 11 2 14.5 3.5 16 C 5 16 5.5 12 5.5 10 Z" fill="#ffffff"/>
  </g>
</svg>